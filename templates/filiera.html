<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SmartFood-Filiera</title>
    
    <link rel="shortcut icon" href="/static/css/logo.ico" />
    <!-- Custom fonts for this template-->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet" />
    <!-- Custom styles for this template-->
    <link href="/static/css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
</head>
<body class="bg-gray-100">

    <div class="container pt-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h1 class="h3 mb-2 text-gray-800">🌱 Tracciabilità Filiera</h1>
                        <div class="text-gray-600">
                            <div class="mb-1"><strong>Blockchain:</strong> <span id="blockchain">{{BLOCKCHAIN}}</span></div>
                            <div><strong>Transaction ID:</strong> <span id="tx">{{TX_ID}}</span></div>
                        </div>
                    </div>
                </div>

                    <div class="card-body">

                        <div id="loading" class="my-5 text-center">
                            <div class="spinner-border text-primary mb-3" role="status"></div>
                            <div><p class="text-gray-600">Caricamento dati dalla blockchain...</p></div>
                        </div>

                        <div id="content" style="display:none;">
                            <div id="product-info" class="mb-4">
                                <!-- Cards info prodotto qui -->
                            </div>

                            <div class="card mb-4">
                                <div class="card-header bg-gradient-primary text-white">
                                    <h4 class="mb-0">📋 Timeline della Filiera</h4>
                                </div>
                                <div class="card-body timeline-container" style="position: relative;">
                                    <div class="timeline-line bg-gray-300" style="position: absolute;left: 45px;top: 0;bottom: 0;width: 4px;"></div>
                                    <div id="timeline-items" class="pl-5">
                                        <!-- Timeline items qui -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="error" style="display:none;">
                            <div class="alert alert-danger">
                                <h5 class="alert-heading">❌ Errore</h5>
                                <p>Impossibile caricare i dati della filiera. Verifica che il QR code sia valido.</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/filiera.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/jquery/jquery.min.js"></script>
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/static/js/sb-admin-2.min.js"></script>

</body>
</html>
