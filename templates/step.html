<div class="container py-5" id="dashboard-content">

  <h2 class="mb-4">Inserisci Step della Filiera</h2>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form id="stepForm" class="row g-3">

        <input type="hidden" id="blockchain" name="blockchain" value="filiera_agroalimentare" />

        <div class="col-12">
          <label for="batch_id" class="form-label">ID del lotto</label>
          <input type="text" class="form-control" id="batch_id" name="batch_id" required />
        </div>

        <div class="col-md-6">
          <label for="type" class="form-label">Tipo (es. raccolta, lavorazione)</label>
          <input type="text" class="form-control" id="type" name="type" required />
        </div>

        <div class="col-md-6">
          <label for="product" class="form-label">Prodotto</label>
          <input type="text" class="form-control" id="product" name="product" required />
        </div>

        <div class="col-md-4">
          <label for="quantity" class="form-label">Quantità</label>
          <input type="number" class="form-control" id="quantity" name="quantity" required min="0" />
        </div>

        <div class="col-md-8">
          <label for="unit" class="form-label">Unità di misura (es. litri, kg)</label>
          <input type="text" class="form-control" id="unit" name="unit" required />
        </div>

        <div class="col-12">
          <label for="location" class="form-label">Località</label>
          <input type="text" class="form-control" id="location" name="location" required placeholder="Scrivi un indirizzo" />
          <ul id="suggestions" class="list-group mt-1"></ul>
        </div>

        <div class="col-md-6">
          <label for="timestamp" class="form-label">Data e ora (ISO 8601)</label>
          <input type="datetime-local" class="form-control" id="timestamp" name="timestamp" required />
        </div>

        <div class="col-md-6">
          <label for="parents" class="form-label">Lotti predecessori (separati da virgola)</label>
          <input type="text" class="form-control" id="parents" name="parents" placeholder="PARENT-LOTT12,PARENT-LOTT34" />
        </div>

        <div class="col-md-6">
          <label for="certification" class="form-label">Certificazione (facoltativo)</label>
          <input type="text" class="form-control" id="certification" name="certification" />
        </div>

        <div class="col-12">
          <label for="notes" class="form-label">Note (facoltativo)</label>
          <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100">Invia Step</button>
        </div>

      </form>
    </div>
  </div>

  <h3 class="mt-4">Risultato API</h3>
  <pre id="result" class="bg-light p-3 rounded border"></pre>
