<body class="bg-gradient-primary">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                            </div>
                            
                            <div id="messaggio_errore"></div>
                            <form class="user" id="register" method="POST">
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="text" class="form-control form-control-user" name="reg-firstname" id="reg-firstname"
                                            placeholder="First Name" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control form-control-user" name="reg-lastname" id="reg-lastname"
                                            placeholder="Last Name" required>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-12 mb-3 mb-sm-0">
                                    <input type="email" class="form-control form-control-user" name="Email" id="reg-email"
                                        placeholder="Email Address" required>
                                    </div>
                                    
                                </div>
                                
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="password" class="form-control form-control-user"
                                            id="reg-password" name="Password" placeholder="Password" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-user"
                                            id="reg-password-confirm" placeholder="Repeat Password" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <select class="form-control" id="reg-ruolo" name="reg-ruolo" required>
                                        <option value="" disabled selected>Select Role</option>
                                        <option value="produttore">Produttore</option>
                                        <option value="distributore">Distributore</option>
                                        <option value="raccoglitore">Raccoglitore</option>  
                                    </select>
                                </div>
                                <div id="register-error" class="alert alert-danger" style="display:none;"></div>
                                <input type="button" id="form_invio" value="Register Account" class="btn btn-primary btn-user btn-block" onclick="register();">
                                
                                <hr>
                                <a href="/auth/google/login" class="btn btn-google btn-user btn-block">
                                    <i class="fab fa-google fa-fw"></i> Register with Google
                                </a>
                                <!--
                                <a href="index.php" class="btn btn-facebook btn-user btn-block">
                                    <i class="fab fa-facebook-f fa-fw"></i> Register with Facebook
                                </a>
                                -->
                                
                            </form>
                            <hr>
                            <!--
                            <div class="text-center">
                                <a class="small" href="forgot-password.html">Forgot Password?</a>
                            </div>
                            -->

                            </div>
                            <div class="text-center">
                                <a class="small" href="https://circularlabs.io/page?page=Transactions">Get A Wallet by circularlabs</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
