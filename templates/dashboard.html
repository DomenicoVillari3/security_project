<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>SmartFood Dashboad</title>
  <link rel="shortcut icon" href="static/css/logo.ico" />
  <link href="static/css/sb-admin-2.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div id="dashboard-content" style="display: none;">
    <nav class="navbar navbar-expand navbar-light bg-primary topbar mb-4 static-top shadow">

      <!-- Sidebar Toggle (Topbar) -->
      <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
          <i class="fa fa-bars"></i>
      </button>

      <!-- Go Back Button -->
      <button id="goback" class="btn-light btn btn-link btn-outline-primary">
          <i class="fa fa-arrow-left mr-1" aria-hidden="true"></i>
          Go Back
      </button>

      <!-- Navigation Links (Hidden on mobile) -->
      <ul class="navbar-nav d-none d-md-flex ml-4">
          <li class="nav-item">
              <a class="nav-link" href="http://localhost:8000/dashboard">
                  <i class="fas fa-fw fa-home"></i>
                  <span>Dashboard</span>
              </a>
          </li>
          <li class="nav-item">
              <a class="nav-link" href="http://localhost:8000/step">
                  <i class="fas fa-fw fa-file-alt"></i>
                  <span>Nuovo step</span>
              </a>
              
          </li>
          <li class="nav-item">
              <a class="nav-link" href="http://localhost:8000/timeline">
                  <i class="fas fa-fw fa-search"></i>
                  <span>Visualizza una Filiera</span>
              </a>
          </li>
          <li class="nav-item">
              <a class="nav-link" href="settings.html">
                  <i class="fas fa-fw fa-cog"></i>
                  <span>Profilo </span>
              </a>
          </li>
      </ul>

      <!-- Topbar Navbar -->
      <ul class="navbar-nav ml-auto">
    
          <div class="topbar-divider d-none d-sm-block"></div>

          <!-- Nav Item - User Information -->
          <li class="nav-item dropdown no-arrow">
              <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                  data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  <span class="mr-2 d-none d-lg-inline text-white-600 small" id="span_user"></span>
                  <img class="img-profile rounded-circle" id="userimg" src="static/css/undraw_profile.svg">
              </a>
              <!-- Dropdown - User Information -->
              <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                  aria-labelledby="userDropdown">
                  <a class="dropdown-item" href="http://localhost:8000/insert_private_key">
                      <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                      Gestione Profilo
                  </a>
                  <a class="dropdown-item" href="http://localhost:8000/user_log">
                      <i class="fas fa-list fa-sm fa-fw mr-2 text-gray-400"></i>
                      Registro Attività
                  </a>
                  <div class="dropdown-divider"></div>
                  <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal" onclick="logout()">
                      <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                      Logout
                  </a>
              </div>
          </li>

      </ul>

  </nav>
<!-- End of Topbar -->


  <div class="container py-5">
    

    <!-- Titolo e saluto -->
    <div class="mb-4">
      <h2 class="fw-bold">Dashboard</h2>
      <p class="text-muted">Benvenuto nella tua area riservata</p>
    </div>

    <!-- Row bottoni -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-3">
        <button id="btn-profile" class="btn btn-primary w-100" onclick="loadProfile()">Mostra Profilo</button>
      </div>
      <div class="col-12 col-md-3">
        <button id="btn-new-step" class="btn btn-success w-100" onclick="window.location.href='http://localhost:8000/step'">Nuovo Step</button>
      </div>
      <div class="col-12 col-md-3">
        <button id="btn-view-filiera" class="btn btn-info w-100 text-white" onclick="window.location.href='http://localhost:8000/timeline'">Visualizza Filiera</button>
      </div>
      <div class="col-12 col-md-3">
        <button id="btn-profile-management" class="btn btn-secondary w-100" onclick="window.location.href='http://localhost:8000/insert_private_key'">Gestione Profilo</button>
      </div>
      <div class="col-12 col-md-3">
        <button id="btn-logout" class="btn btn-danger w-100" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Card dati utente -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white">
        <strong>Dati utente</strong>
      </div>
      <div class="card-body p-3">
        <pre id="profile-data" class="mb-0 bg-light p-3 rounded" style="white-space: pre-wrap;"></pre>
      </div>
    </div>

    <!-- Alert errori -->
    <div id="dashboard-error" class="alert alert-danger mt-3" style="display:none;"></div>

  </div>
</div>

<script src="/static/js/protected.js"></script>
<script src="static/js/go_back.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="static/vendor/jquery/jquery.min.js"></script>
<script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="static/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="static/js/sb-admin-2.min.js"></script>

</body>
</html>
